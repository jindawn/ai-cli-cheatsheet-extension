name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    outputs:
      advanced_release: ${{ steps.capabilities.outputs.advanced_release }}
    steps:
      - name: Check optional signed-installer release capability
        id: capabilities
        env:
          PROVIDER_CATALOG_SIGNING_KEY: ${{ secrets.PROVIDER_CATALOG_SIGNING_KEY }}
          MACOS_CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          missing=()
          for name in \
            PROVIDER_CATALOG_SIGNING_KEY \
            MACOS_CERTIFICATES_P12 \
            MACOS_CERTIFICATES_PASSWORD \
            MACOS_KEYCHAIN_PASSWORD \
            MACOS_APPLICATION_IDENTITY \
            MACOS_INSTALLER_IDENTITY \
            APPLE_ID \
            APPLE_APP_PASSWORD \
            APPLE_TEAM_ID \
            WINDOWS_SIGNING_PFX \
            WINDOWS_SIGNING_PASSWORD \
            RELEASE_GPG_PRIVATE_KEY \
            RELEASE_GPG_PASSPHRASE; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "advanced_release=true" >> "$GITHUB_OUTPUT"
            echo "Signed bridge installers and signed checksums are enabled."
          else
            echo "advanced_release=false" >> "$GITHUB_OUTPUT"
            echo "Signed bridge installers are unavailable for this release; publishing verified extension archives without installer entry points."
          fi

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release tag
        run: node tools/check-release.js --tag "$GITHUB_REF_NAME"
      - name: Check JavaScript syntax
        run: |
          printf '%s\0' popup.js popup-state.js popup-render.js popup-toast.js popup-dialogs.js popup-loader.js popup-tasks.js dynamic-data.js distribution.js pinyin-initials.js background.js product-core.js quality-core.js usage-examples.js tools/package-extension.js tools/audit-release-secrets.js tools/publish-chrome-store.js tools/capture-store-screenshot.js tools/verify-release-assets.js | xargs -0 -n1 node --check
          find data enrichments -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate data and application behavior
        run: |
          node tools/validate-data.js
          node tests/test_validation_consistency.js
          node tests/test_global_official_contract.js
          node tests/test_product_core.js
          node tests/test_usage_examples.js
          node tests/test_popup_ux.js
          node tests/test_background.js
          node tests/test_command_partition.js
          node tests/test_dynamic_data.js
          node tests/test_bridge_release.js
          node tests/test_search_quality.js
          node tests/test_quality_core.js
          node tools/audit-quality.js --check
          node tests/test_packaging.js
      - name: Python lint and security scan
        run: |
          pip install ruff bandit
          ruff check native-host tools
          bandit -q -c bandit.yaml -r native-host tools
      - name: Run Native Host tests
        run: python -m unittest discover -s tests -v
      - name: Build release directories
        run: |
          node tools/package-extension.js --channel source --output dist/source
          node tools/package-extension.js --channel store --output dist/store
      - name: Smoke test both release channels
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          xvfb-run -a node tests/test_extension_smoke.js dist/source
          xvfb-run -a node tests/test_extension_smoke.js dist/store
      - name: Create extension archives and checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          (cd dist/source && zip -X -q -r "../ai-cli-cheatsheet-source-v${VERSION}.zip" .)
          (cd dist/store && zip -X -q -r "../ai-cli-cheatsheet-store-v${VERSION}.zip" .)
          node tools/verify-release-assets.js --directory dist --version "$VERSION" --basic-only
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/ai-cli-cheatsheet-*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  build-bridge:
    needs: [build-and-test, release-preflight]
    if: needs.release-preflight.outputs.advanced_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: x64
          - runner: windows-2022
            platform: windows
            arch: x64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build self-contained bridge binary
        shell: bash
        env:
          PROVIDER_CATALOG_SIGNING_KEY: ${{ secrets.PROVIDER_CATALOG_SIGNING_KEY }}
        run: |
          test -n "$PROVIDER_CATALOG_SIGNING_KEY"
          python tools/provider-catalog.py write-public-key --output shared/provider-catalog-public-key.json
          python -m pip install pyinstaller
          python -m PyInstaller native-host/bridge.spec --distpath dist/bridge-bin --workpath dist/bridge-work --noconfirm
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm ruby-dev
          sudo gem install --no-document fpm
      - name: Install WiX
        if: matrix.platform == 'windows'
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Import macOS signing identities
        if: matrix.platform == 'macos'
        env:
          MACOS_CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$MACOS_CERTIFICATES_P12"
          echo "$MACOS_CERTIFICATES_P12" | base64 --decode > signing.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import signing.p12 -k build.keychain -P "$MACOS_CERTIFICATES_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
      - name: Import Windows signing certificate
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
        run: |
          if (-not $env:WINDOWS_SIGNING_PFX) { throw "WINDOWS_SIGNING_PFX is required" }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\bridge-signing.pfx", [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX))
      - name: Package signed bridge installer
        shell: bash
        env:
          MACOS_APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_SIGNING_CERTIFICATE: ${{ runner.temp }}\bridge-signing.pfx
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BINARY="dist/bridge-bin/aicli-cheatsheet-bridge"
          if [ "${{ matrix.platform }}" = "windows" ]; then BINARY="${BINARY}.exe"; fi
          EXTRA=()
          if [ "${{ matrix.platform }}" != "linux" ]; then EXTRA+=(--require-signing); fi
          python tools/build-bridge-assets.py \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --binary "$BINARY" \
            --output dist/bridge-assets \
            --version "$VERSION" \
            "${EXTRA[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/bridge-assets/ai-cli-cheatsheet-bridge-*
          if-no-files-found: error

  github-release:
    needs: [build-and-test, release-preflight, build-bridge]
    if: ${{ always() && needs.build-and-test.result == 'success' && needs.release-preflight.result == 'success' && (needs.release-preflight.outputs.advanced_release != 'true' || needs.build-bridge.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - uses: actions/download-artifact@v4
        if: needs.release-preflight.outputs.advanced_release == 'true'
        with:
          pattern: bridge-*
          path: release-assets
          merge-multiple: true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify bridge installers before enabling installer entry points
        if: needs.release-preflight.outputs.advanced_release == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node tools/verify-release-assets.js --directory release-assets --version "$VERSION" --bridge-only
      - name: Rebuild release packages with verified installer entry points
        if: needs.release-preflight.outputs.advanced_release == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node tools/package-extension.js --channel source --output dist/source-release --bridge-installers-ready
          node tools/package-extension.js --channel store --output dist/store-release --bridge-installers-ready
          rm -f "release-assets/ai-cli-cheatsheet-source-v${VERSION}.zip"
          rm -f "release-assets/ai-cli-cheatsheet-store-v${VERSION}.zip"
          (cd dist/source-release && zip -X -q -r "../../release-assets/ai-cli-cheatsheet-source-v${VERSION}.zip" .)
          (cd dist/store-release && zip -X -q -r "../../release-assets/ai-cli-cheatsheet-store-v${VERSION}.zip" .)
      - name: Verify basic extension release set
        if: needs.release-preflight.outputs.advanced_release != 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node tools/verify-release-assets.js --directory release-assets --version "$VERSION" --basic-only
      - name: Verify complete signed release set
        if: needs.release-preflight.outputs.advanced_release == 'true'
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node tools/verify-release-assets.js --directory release-assets --version "$VERSION"
          test -n "$RELEASE_GPG_PRIVATE_KEY"
          echo "$RELEASE_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$RELEASE_GPG_PASSPHRASE" \
            --armor --detach-sign --output release-assets/SHA256SUMS.asc release-assets/SHA256SUMS
          gpg --verify release-assets/SHA256SUMS.asc release-assets/SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
      - name: Publish signed Provider catalog
        if: needs.release-preflight.outputs.advanced_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER_CATALOG_SIGNING_KEY: ${{ secrets.PROVIDER_CATALOG_SIGNING_KEY }}
        run: |
          python tools/provider-catalog.py sign \
            --input shared/provider-catalog-template.json \
            --output release-assets/provider-catalog-envelope.json
          if gh release view provider-catalog --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload provider-catalog release-assets/provider-catalog-envelope.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create provider-catalog release-assets/provider-catalog-envelope.json \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Provider adapter catalog" \
              --notes "Signed declarative provider adapters for the local bridge."
          fi

  chrome-web-store:
    needs: [github-release, release-preflight]
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: read
    steps:
      - name: Check Chrome Web Store configuration
        id: cws
        env:
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          ADVANCED_RELEASE: ${{ needs.release-preflight.outputs.advanced_release }}
        run: |
          if [ "$ADVANCED_RELEASE" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signed bridge installers are not available; skipping Chrome Web Store submission."
          elif [ -n "$PUBLISHER_ID" ] && [ -n "$EXTENSION_ID" ]; then
            test "$EXTENSION_ID" = "jdiopjiebnamikpcknmnpahhlokccgjj"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Chrome Web Store IDs are not configured; skipping store submission."
          fi
      - uses: actions/checkout@v4
        if: steps.cws.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.cws.outputs.enabled == 'true'
        with:
          node-version: "22"
      - name: Download and verify published GitHub Release assets
        if: steps.cws.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets
          VERSION="${GITHUB_REF_NAME#v}"
          test -s release-assets/SHA256SUMS.asc
          node tools/verify-release-assets.js --directory release-assets --version "$VERSION" --check
      - name: Upload and submit staged review
        if: steps.cws.outputs.enabled == 'true'
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node tools/publish-chrome-store.js \
            --package "release-assets/ai-cli-cheatsheet-store-v${VERSION}.zip" \
            --version "$VERSION"
